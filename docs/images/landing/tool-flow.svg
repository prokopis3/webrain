<svg width="720" height="240" viewBox="0 0 720 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111115"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- arrows between nodes -->
  <g stroke="rgba(255,255,255,0.14)" stroke-width="1.5" marker-end="none">
    <line x1="150" y1="120" x2="182" y2="120"/>
    <line x1="290" y1="120" x2="322" y2="120"/>
    <line x1="430" y1="120" x2="462" y2="120"/>
  </g>
  <g fill="rgba(255,255,255,0.5)">
    <path d="M180 115 L190 120 L180 125 Z"/>
    <path d="M320 115 L330 120 L320 125 Z"/>
    <path d="M460 115 L470 120 L460 125 Z"/>
  </g>

  <!-- nodes -->
  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="13">
    <rect x="40" y="94" width="110" height="52" rx="16" fill="url(#node)" stroke="rgba(255,255,255,0.10)"/>
    <text x="63" y="120" fill="#a1a1aa">navigate</text>
    <text x="63" y="136" fill="#52525b">page + challenge</text>

    <rect x="190" y="94" width="100" height="52" rx="16" fill="url(#node)" stroke="rgba(255,255,255,0.10)"/>
    <text x="213" y="120" fill="#a1a1aa">observe</text>
    <text x="213" y="136" fill="#52525b">a11y / semantic</text>

    <rect x="330" y="94" width="100" height="52" rx="16" fill="url(#node)" stroke="rgba(255,255,255,0.10)"/>
    <text x="353" y="120" fill="#a1a1aa">interact</text>
    <text x="353" y="136" fill="#52525b">click / type</text>

    <rect x="470" y="94" width="100" height="52" rx="16" fill="url(#node)" stroke="rgba(255,255,255,0.10)"/>
    <text x="493" y="120" fill="#a1a1aa">extract</text>
    <text x="493" y="136" fill="#52525b">schema / regex</text>

    <!-- result -->
    <rect x="600" y="86" width="92" height="68" rx="18" fill="url(#accent)" fill-opacity="0.14" stroke="rgba(59,130,246,0.5)"/>
    <text x="622" y="116" fill="#60a5fa">JSON</text>
    <text x="622" y="136" fill="#34d399">42 rows</text>
  </g>

  <!-- baseline -->
  <line x1="40" y1="176" x2="692" y2="176" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="204" font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" fill="#52525b">one MCP server · CdpBackend → Chrome / Lightpanda / Obscura · no hand-written selectors</text>
</svg>
