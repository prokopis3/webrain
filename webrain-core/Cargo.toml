[package]
name = "webrain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true

[features]
default = []
# Google Pdfium backend for PDF text extraction — handles ALL fonts (LaTeX,
# CJK, custom encodings). Requires pdfium.dll/libpdfium.so at runtime.
# Also adds pdf_render() for PixelRAG-style visual page rendering.
pdfium = ["dep:pdfium-render"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
url = "2"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
aes-gcm = "0.11"
getrandom = "0.4"
hmac = "0.13"
sha1 = "0.11"
regex = "1"
# Structured SERP parsing (webrain_serp): pure-Rust CSS selector extraction.
scraper = "0.24"
# HTML → Markdown (turndown.js-equivalent, pure Rust) for webrain_batch op=markdown.
htmd = "0.5"
# Optional: Google Pdfium for PDF text extraction (handles ALL fonts).
# Download pdfium from https://github.com/paulocoutinhox/pdfium-lib/releases
pdfium-render = { version = "0.9", optional = true }
image = "0.25"
# Used directly for image XObject extraction from PDFs. Pinned to 0.41 to
# MATCH pdf-inspector's transitive lopdf (0.44 compiled a second, duplicate PDF
# stack). The extraction code already targets 0.41's API. Removed when
# pdf-inspector exposes images natively.
lopdf = "0.41"
flate2 = "1"
# agent-browser-style engine install: Chrome for Testing archives are .zip on
# every platform, so no tar needed (see src/install.rs).
zip = "2"
# Firecrawl pdf-inspector: pure Rust on lopdf — proper ToUnicode CMap decoding,
# Markdown output, table detection, layout classification.
pdf-inspector = "0.1.7"
# Zero-code alternative (the implemented path): `obscura serve --host 0.0.0.0
# --stealth` in Docker maps :9222 — CdpBackend drives it via
# CDP_URL=ws://127.0.0.1:9222/devtools/browser (raw ws:// passthrough in resolve_ws).
