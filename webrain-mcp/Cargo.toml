[package]
name = "webrain-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true

[dependencies]
webrain-core = { path = "../webrain-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tiktoken-rs = { workspace = true }

[features]
# ponytail: forward pdfium to webrain-core so `--features pdfium` actually
# enables pdf_render (previously the cfg referenced a feature webrain-mcp
# never declared, so pdf_render always errored).
pdfium = ["webrain-core/pdfium"]
