# ============================================================================
# Changelog Enforcement
# ============================================================================
# Ensures CHANGELOG.md is updated whenever code changes are made to main
# source files. This keeps the changelog accurate and release-ready.
# ============================================================================

name: Changelog Enforce

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-changelog:
    name: Enforce Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for CHANGELOG changes
        id: changelog_check
        run: |
          # PR: diff against the base branch; push: the exact pushed range
          # (github.event.before), falling back to the last commit.
          if [ "${{ github.base_ref }}" != "" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ "${{ github.event.before }}" != "" ]; then
            RANGE="${{ github.event.before }}...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi
          CHANGED=$(git diff --name-only $RANGE | grep -c "CHANGELOG.md" || true)
          echo "changelog_changed=$CHANGED" >> $GITHUB_OUTPUT

          # Check if Rust source files were changed (exclude docs, config)
          SOURCE_CHANGED=$(git diff --name-only $RANGE | grep -cE "^(webrain-core/|webrain-mcp/|webrain-cli/|Cargo\.(toml|lock))" || true)
          echo "source_changed=$SOURCE_CHANGED" >> $GITHUB_OUTPUT

      - name: Fail if changelog missing
        if: steps.changelog_check.outputs.changelog_changed == '0' && steps.changelog_check.outputs.source_changed > '0'
        run: |
          echo "::error::Rust source changed but CHANGELOG.md was not updated. Add an entry under [Unreleased]. See https://keepachangelog.com for format."
          exit 1

      - name: Comment if changelog missing
        if: github.event_name == 'pull_request' && steps.changelog_check.outputs.changelog_changed == '0' && steps.changelog_check.outputs.source_changed > '0'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: changelog
          message: |
            ## ⚠️ CHANGELOG.md not updated

            Rust source files in `webrain-core/`, `webrain-mcp/`, or `webrain-cli/`
            were changed, but `CHANGELOG.md` was not updated.

            Please add an entry under `[Unreleased]` describing your changes.
            See [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) for format guidelines.
