# ============================================================================
# PR Conventional Commit Lint
# ============================================================================
# Validates that pull request titles follow the Conventional Commits format:
#   <type>(<scope>): <description>
#
# Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
# This keeps the git history clean and enables automatic CHANGELOG generation.
# ============================================================================

name: PR Lint

# NOTE: keep `pull_request` (NOT `pull_request_target`). Branch protection on
# main requires the "Lint PR Title" status check, and `pull_request_target`
# workflows load their file from the BASE branch — until main's copy also uses
# `pull_request_target`, switching here would leave the required check dead and
# block every merge. Migrate both copies together in a separate change.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lint-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        id: lint_pr_title
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            engines
            mcp
            tools
            cli
            install
            launch
            login
            vault
            vision
            pdf
            download
            cookies
            batch
            extraction
            navigation
            stealth
            antibot
            session
            media
            docs
            build
            ci
            style
            perf
            dist
            deps
            config
            test
            skill
            script
            release
          requireScope: false
          wip: true
          validateSingleCommit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post lint result
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: pr-lint
          message: |
            ## ❌ PR Title doesn't follow Conventional Commits

            ${{ steps.lint_pr_title.outputs.error_message }}

            ### ✅ Examples of valid PR titles:

            ```
            feat(core): add CDP browser backend
            fix(cli): resolve install path detection on Windows
            refactor(engines): unify lightpanda/obscura discovery
            docs: update README with architecture overview
            test: add engine unit tests
            chore(deps): update tokio to v1.4x
            ```

            ---
            *Format: `<type>(<scope>): <description>`*

            See [Conventional Commits](https://www.conventionalcommits.org/) for details.
