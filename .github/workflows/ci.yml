# ============================================================================
# CI Pipeline
# ============================================================================
# Runs on every push and pull request to main.
# Enforces code quality: formatting, clippy, and tests.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Supply-chain hardening: third-party actions are pinned to the full commit
      # SHA of the tag they resolved at (mutable tags can be force-moved). The
      # tag stays in the comment for readability; Dependabot updates the SHA.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Docs: every .md/.mdx under docs/ must be in docs.json nav or listed in
      # .mintignore — internal/working files must never get published by
      # accident (the .mintignore header comment's promise, now enforced).
      - name: Docs orphan check
        run: python3 .github/scripts/check_docs_orphans.py

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace
