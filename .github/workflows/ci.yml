# ============================================================================
# CI Pipeline
# ============================================================================
# Runs on every push and pull request to main.
# Enforces code quality: formatting, clippy, and tests.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Supply-chain hardening: third-party actions are pinned to the full commit
      # SHA of the tag they resolved at (mutable tags can be force-moved). The
      # tag stays in the comment for readability; Dependabot updates the SHA.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Docs: every .md/.mdx under docs/ must be in docs.json nav or listed in
      # .mintignore — internal/working files must never get published by
      # accident (the .mintignore header comment's promise, now enforced).
      - name: Docs orphan check
        run: python3 .github/scripts/check_docs_orphans.py

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --features pdfium

      # The `chat` feature is off by default (it pulls a ~135 MB bundled Copilot
      # runtime at build time), so without this step it would only ever be
      # compiled by a release tag — i.e. it would rot silently between releases.
      # One Linux job, download and all, is the cheapest way to keep it honest.
      - name: check chat feature
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          cargo clippy -p webrain-cli --all-targets --features pdfium,chat

      - name: test
        run: cargo test --workspace

  # The `chat` feature embeds a *per-platform* Copilot runtime at build time, so
  # "it compiled on Linux" proves nothing about macOS or Windows: different
  # runtime asset, different TLS backend (schannel / Security.framework / OS
  # OpenSSL), different linker. Build it on each host before a release tag ever
  # has to find out. Host triples only (linux-x64, macos-arm64, windows-x64);
  # the release matrix still owns the cross targets.
  chat-build:
    name: chat build (${{ matrix.os }})
    # Push-only on purpose: the `check` job already compiles `pdfium,chat` on
    # Linux for every PR, and three more ~135 MB runtime downloads per PR is not
    # worth the extra signal.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned to the image the release builds against, not
        # `ubuntu-latest`: GitHub has announced `ubuntu-latest` migrating to a
        # newer LTS, and a surprise OpenSSL/glibc change is exactly the failure
        # this job exists to catch — it must not be the thing that causes one.
        # macOS/Windows stay on the floating labels; their `-latest` images are
        # the ones whose TLS backend we want to exercise.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `network-forwarding` links OS OpenSSL 3 on Linux; macOS and Windows use
      # their platform TLS and need nothing extra. (musl vendors its own — see
      # the `chat-build-musl` job.)
      - name: OS OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: build with pdfium + chat
        run: cargo build --release --features pdfium,chat --bin webrain

      # Prove the runtime actually landed in the binary and the (offline) BYOK
      # resolution chain runs. Unconfigured is exit 1 by design, hence `|| true`.
      - name: smoke (chat compiled in, config chain works)
        shell: bash
        run: |
          cargo run --release --quiet --features pdfium,chat --bin webrain -- \
            chat --print-config > chat-config.json || true
          cat chat-config.json
          grep -q '"configured"' chat-config.json

  chat-build-musl:
    name: chat build (static musl)
    # Push-only, like the job above. This is the one target shape whose OpenSSL
    # is vendored and compiled by musl-gcc, so it is the shape a release tag
    # would otherwise be first to try.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # perl/make drive the vendored OpenSSL build; libssl-dev is for the
      # build-HOST copy of openssl-sys (build scripts always run on the host).
      - name: musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools libssl-dev perl make
          rustup target add x86_64-unknown-linux-musl

      - name: build with pdfium + chat (static)
        run: cargo build --release --features pdfium,chat --bin webrain --target x86_64-unknown-linux-musl

      # The whole point of the row: a static binary, not a glibc one that
      # happens to compile.
      - name: assert the artifact is static
        run: |
          file target/x86_64-unknown-linux-musl/release/webrain
          file target/x86_64-unknown-linux-musl/release/webrain | grep -Eq 'static-pie linked|statically linked'
