# ============================================================================
# Release Workflow
# ============================================================================
# Triggers on a pushed version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds the release binary natively on Linux, Windows, and macOS (arm64),
# then attaches every binary to a GitHub Release with auto-generated notes.
# No version auto-bump, no registry publish.
# ============================================================================

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: webrain
            out: webrain-linux
          - os: windows-latest
            bin: webrain.exe
            out: webrain-windows.exe
          - os: macos-latest
            bin: webrain
            out: webrain-macos
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin webrain

      # linux and macos both emit target/release/webrain — rename so the release
      # has one distinct asset per platform (otherwise merge-multiple overwrites).
      - name: Rename for release
        shell: bash
        run: mv target/release/${{ matrix.bin }} target/release/${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webrain-${{ matrix.os }}
          path: target/release/${{ matrix.out }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      # Release description comes from CHANGELOG.md. If the tagged version has no
      # entry yet, generate it from [Unreleased] and commit it back.
      - name: Ensure changelog entry for the tagged version
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if grep -q "^## \\[${VER}\\]" CHANGELOG.md; then
            echo "changelog entry exists for ${VER}"
          else
            echo "No '## [${VER}]' entry — generating from [Unreleased]"
            python3 - "$VER" "$(date +%F)" <<'PY'
import sys, pathlib, re
ver, date = sys.argv[1], sys.argv[2]
p = pathlib.Path("CHANGELOG.md")
t = p.read_text(encoding="utf-8")
m = re.search(r"^## \[Unreleased\](.*?)(?=^## \[|\Z)", t, re.M | re.S)
if not m:
    sys.exit("no [Unreleased] section in CHANGELOG.md")
released = f"## [{ver}] - {date}" + m.group(1)
out = "## [Unreleased]\n\n### Added\n\n_No unreleased changes yet._\n\n" + t[:m.start()] + released
p.write_text(out, encoding="utf-8")
PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): changelog for ${VER}" || true
            git push origin main || echo "changelog push skipped"
          fi

      - name: Extract release body from changelog
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="[$VER]" '
            /^## \[/ { if (inblock) exit; if (index($0, h)) inblock = 1; next }
            inblock { print }
          ' CHANGELOG.md > body.md
          test -s body.md || { echo "empty release body for ${VER}"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
