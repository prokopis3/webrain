# ============================================================================
# Release Workflow
# ============================================================================
# Triggers on a pushed version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds the release binary natively on Linux, Windows, and macOS (arm64),
# then attaches every binary to a GitHub Release with auto-generated notes.
# No version auto-bump, no registry publish.
# ============================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: webrain
            out: webrain-linux
          - os: windows-latest
            bin: webrain.exe
            out: webrain-windows.exe
          - os: macos-latest
            bin: webrain
            out: webrain-macos
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin webrain

      # linux and macos both emit target/release/webrain — rename so the release
      # has one distinct asset per platform (otherwise merge-multiple overwrites).
      - name: Rename for release
        shell: bash
        run: mv target/release/${{ matrix.bin }} target/release/${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: webrain-${{ matrix.os }}
          path: target/release/${{ matrix.out }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      # Release description comes from CHANGELOG.md. If the tagged version has no
      # entry yet, generate it from [Unreleased] and commit it back.
      - name: Ensure changelog entry for the tagged version
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if grep -q "^## \\[${VER}\\]" CHANGELOG.md; then
            echo "changelog entry exists for ${VER}"
          else
            echo "No '## [${VER}]' entry — generating from [Unreleased]"
            python3 -c "
            import sys, pathlib, re
            ver, date = sys.argv[1], sys.argv[2]
            p = pathlib.Path('CHANGELOG.md')
            t = p.read_text(encoding='utf-8')
            m = re.search(r'^## \[Unreleased\](.*?)(?=^## \[|\Z)', t, re.M | re.S)
            if not m:
                sys.exit('no [Unreleased] section in CHANGELOG.md')
            released = f'## [{ver}] - {date}' + m.group(1)
            out = '## [Unreleased]\n\n### Added\n\n_No unreleased changes yet._\n\n' + t[:m.start()] + released
            p.write_text(out, encoding='utf-8')
            " "$VER" "$(date +%F)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): changelog for ${VER}" || true
            git push origin main || echo "changelog push skipped"
          fi

      - name: Extract release body from changelog
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="[$VER]" '
            /^## \[/ { if (inblock) exit; if (index($0, h)) inblock = 1; next }
            inblock { print }
          ' CHANGELOG.md > body.md
          test -s body.md || { echo "empty release body for ${VER}"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packages:
    name: Bump Scoop + Homebrew manifests
    needs: release
    runs-on: ubuntu-latest
    # ponytail: GITHUB_TOKEN can't write OTHER repos, so this needs a
    # cross-repo PAT as the repo secret RELEASE_PAT (fine-grained,
    # Contents:write on prokopis3/webrain + scoop-webrain + homebrew-webrain).
    # No secret set -> job skips (release still succeeds).
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      - name: Bump scoop + homebrew manifests
        if: env.GH_TOKEN != ''
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          WIN_SHA="$(sha256sum dist/webrain-windows.exe | awk '{print toupper($1)}')"
          MAC_SHA="$(sha256sum dist/webrain-macos | awk '{print $1}')"

          # fetch current manifests (they live in OTHER repos, not this checkout)
          gh api "repos/prokopis3/scoop-webrain/contents/bucket/webrain.json" --jq .content | base64 -d > bucket.json
          gh api "repos/prokopis3/homebrew-webrain/contents/Formula/webrain.rb" --jq .content | base64 -d > formula.rb

          # scoop: jq-edit in place (keeps description/bin/checkver/autoupdate)
          jq --arg v "$VER" --arg h "$WIN_SHA" \
            '.version = $v
             | .architecture."64bit".url = ("https://github.com/prokopis3/webrain/releases/download/v" + $v + "/webrain-windows.exe")
             | .architecture."64bit".hash = $h' \
            bucket.json > /tmp/bucket.json && mv /tmp/bucket.json bucket.json

          # homebrew: sed the version/url/sha256
          sed -i -E "s|/v[0-9.]+/webrain-macos|/v${VER}/webrain-macos|; s|sha256 \"[a-f0-9]+\"|sha256 \"${MAC_SHA}\"|; s|version \"[0-9.]+\"|version \"${VER}\"|" formula.rb

          put() {
            local repo="$1" path="$2" file="$3"
            local sha b64
            sha="$(gh api "repos/${repo}/contents/${path}" --jq .sha)"
            b64="$(base64 -w0 "${file}")"
            gh api -X PUT "repos/${repo}/contents/${path}" \
              -f "message=webrain ${VER}" \
              -f "content=${b64}" \
              -f "sha=${sha}" \
              -f "branch=main" >/dev/null
          }
          put prokopis3/scoop-webrain bucket/webrain.json bucket.json
          put prokopis3/homebrew-webrain Formula/webrain.rb formula.rb
