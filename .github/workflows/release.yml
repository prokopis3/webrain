# ============================================================================
# Release Workflow
# ============================================================================
# Triggers on a pushed version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds one binary per (OS, arch) target and attaches every one to a GitHub
# Release with auto-generated notes. No version auto-bump, no registry publish.
#
# Target matrix = what a user can actually run. Native runners where they exist;
# the two Linux builds that have no arm64/musl runner are cross-linked from the
# x86_64 runner with a distro cross-compiler (see `apt:` in the matrix), so a
# cross build is reproducible from this file alone.
# ============================================================================

name: Release

# Two runs for the same tag must not race on changelog commits / release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Cross-linkers for the two Linux targets with no matching runner. Unused —
    # and ignored — on the macOS and Windows jobs.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: webrain
            asset: webrain-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bin: webrain
            asset: webrain-linux-aarch64
            apt: gcc-aarch64-linux-gnu
          # Static, so it runs on Alpine (the Docker image) and on distros older
          # than the runner's glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            bin: webrain
            asset: webrain-linux-x86_64-musl
            apt: musl-tools
          # macos-latest is arm64; the Intel binary is cross-built (Apple's
          # linker handles both arches, and the Intel runner image is retired).
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: webrain
            asset: webrain-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: webrain
            asset: webrain-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: webrain.exe
            asset: webrain-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: webrain.exe
            asset: webrain-windows-aarch64.exe
    steps:
      - uses: actions/checkout@v7
      - name: Install cross toolchain
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      # Supply-chain hardening: third-party actions are pinned to the full commit
      # SHA of the tag they resolved at (mutable tags can be force-moved).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin webrain --target ${{ matrix.target }}

      # Per-target output dirs, so every job emits the SAME asset name it
      # uploads — merge-multiple then cannot overwrite one platform with another
      # (the old scheme renamed three shared `target/release/webrain` outputs).
      - name: Rename for release
        shell: bash
        run: mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "target/${{ matrix.target }}/release/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job writes to the repo (changelog commit + release assets).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      # Release description comes from CHANGELOG.md. If the tagged version has no
      # entry yet, generate it from [Unreleased] and commit it back.
      - name: Ensure changelog entry for the tagged version
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # workflow_dispatch on a branch (e.g. main) is not a version tag — bail
          # instead of generating a malformed '## [main]' entry / bad asset URLs.
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a version tag (vX.Y.Z), got '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          if grep -q "^## \\[${VER}\\]" CHANGELOG.md; then
            echo "changelog entry exists for ${VER}"
          else
            echo "No '## [${VER}]' entry — generating from [Unreleased]"
            python3 -c "
            import sys, pathlib, re
            ver, date = sys.argv[1], sys.argv[2]
            p = pathlib.Path('CHANGELOG.md')
            t = p.read_text(encoding='utf-8')
            m = re.search(r'^## \[Unreleased\](.*?)(?=^## \[|\Z)', t, re.M | re.S)
            if not m:
                sys.exit('no [Unreleased] section in CHANGELOG.md')
            released = f'## [{ver}] - {date}' + m.group(1)
            # Keep EVERYTHING after the old [Unreleased] block (all previously
            # released entries). Omitting t[m.end():] destroyed release history.
            out = t[:m.start()] + '## [Unreleased]\n\n### Added\n\n_No unreleased changes yet._\n\n' + released + t[m.end():]
            p.write_text(out, encoding='utf-8')
            " "$VER" "$(date +%F)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): changelog for ${VER}" || true
            # A tag push leaves the workspace on detached HEAD (no local main) —
            # push the current commit explicitly instead of a nonexistent ref.
            # The changelog back-commit is ancillary to publishing: tolerate a
            # rejected push (non-fast-forward on a protected branch) so the
            # release still proceeds.
            git push origin HEAD:main || echo "::warning::changelog push skipped; release continues"
          fi

      - name: Extract release body from changelog
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="[$VER]" '
            /^## \[/ { if (inblock) exit; if (index($0, h)) inblock = 1; next }
            inblock { print }
          ' CHANGELOG.md > body.md
          test -s body.md || { echo "empty release body for ${VER}"; exit 1; }

      # Publish a checksums.txt alongside the binaries so installers and
      # `webrain self-update` can verify downloads (supply-chain integrity).
      # `*` so adding a target to the matrix needs no change here.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packages:
    name: Bump Scoop + Homebrew manifests
    needs: release
    runs-on: ubuntu-latest
    # ponytail: GITHUB_TOKEN can't write OTHER repos, so this needs a
    # cross-repo PAT as the repo secret RELEASE_PAT (fine-grained,
    # Contents:write on prokopis3/webrain + scoop-webrain + homebrew-webrain).
    # No secret set -> job skips (release still succeeds).
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      - name: Bump scoop + homebrew manifests
        if: env.GH_TOKEN != ''
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a version tag (vX.Y.Z), got '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          WIN_SHA="$(sha256sum dist/webrain-windows-x86_64.exe | awk '{print toupper($1)}')"
          WIN_ARM_SHA="$(sha256sum dist/webrain-windows-aarch64.exe | awk '{print toupper($1)}')"
          MAC_SHA="$(sha256sum dist/webrain-macos-aarch64 | awk '{print $1}')"

          # fetch current manifests (they live in OTHER repos, not this checkout)
          gh api "repos/prokopis3/scoop-webrain/contents/bucket/webrain.json" --jq .content | base64 -d > bucket.json
          gh api "repos/prokopis3/homebrew-webrain/contents/Formula/webrain.rb" --jq .content | base64 -d > formula.rb

          # scoop: jq-edit in place (keeps description/bin/checkver/autoupdate)
          jq --arg v "$VER" --arg h "$WIN_SHA" --arg ha "$WIN_ARM_SHA" \
            '.version = $v
             | .architecture."64bit".url = ("https://github.com/prokopis3/webrain/releases/download/v" + $v + "/webrain-windows-x86_64.exe")
             | .architecture."64bit".hash = $h
             | .architecture."arm64".url = ("https://github.com/prokopis3/webrain/releases/download/v" + $v + "/webrain-windows-aarch64.exe")
             | .architecture."arm64".hash = $ha' \
            bucket.json > /tmp/bucket.json && mv /tmp/bucket.json bucket.json

          # homebrew: sed the version/url/sha256 (arm64 bottle; Intel Macs need an
          # on_intel block pointing at webrain-macos-x86_64 — other repo).
          sed -i -E "s|/v[0-9.]+/webrain-macos[a-z0-9_-]*|/v${VER}/webrain-macos-aarch64|; s|sha256 \"[a-f0-9]+\"|sha256 \"${MAC_SHA}\"|; s|version \"[0-9.]+\"|version \"${VER}\"|" formula.rb

          put() {
            local repo="$1" path="$2" file="$3"
            local sha b64
            sha="$(gh api "repos/${repo}/contents/${path}" --jq .sha)"
            b64="$(base64 -w0 "${file}")"
            gh api -X PUT "repos/${repo}/contents/${path}" \
              -f "message=webrain ${VER}" \
              -f "content=${b64}" \
              -f "sha=${sha}" \
              -f "branch=main" >/dev/null
          }
          put prokopis3/scoop-webrain bucket/webrain.json bucket.json
          put prokopis3/homebrew-webrain Formula/webrain.rb formula.rb
