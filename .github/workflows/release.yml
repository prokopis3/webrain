# ============================================================================
# Release Workflow
# ============================================================================
# Triggers on PR merge to main (closed PRs that were merged).
# Automatically:
#   1. Determines the next SemVer version from conventional commits
#   2. Updates CHANGELOG.md with the new release
#   3. Updates pyproject.toml with the new version
#   4. Creates a GitHub Release with auto-generated release notes
#   5. Commits the version bump back to main
# ============================================================================

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install commitizen

      - name: Determine next version (dry-run to preview)
        id: cz_preview
        run: |
          cz bump --dry-run --yes 2>&1 || true
          NEXT_VERSION=$(cz bump --dry-run --yes 2>&1 | grep -oP 'tag to create: \Kv?[\d]+\.[\d]+\.[\d]+' || echo "v2.0.0")
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Detected next version: $NEXT_VERSION"

      - name: Bump version and update CHANGELOG
        id: cz_bump
        run: |
          cz bump --yes --changelog-to-stdout 2>&1 | tee bump_output.txt
          # Extract the new version from pyproject.toml after bump
          NEW_VER=$(grep -oP 'version = "\K[\d]+\.[\d]+\.[\d]+' pyproject.toml || echo "2.0.0")
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Commit version bump
        id: commit_bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.cz_bump.outputs.new_version }}

          Auto-generated by commitizen from conventional commits."

      - name: Push changes
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.cz_bump.outputs.new_version }}
          name: v${{ steps.cz_bump.outputs.new_version }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
