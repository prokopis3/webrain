# ============================================================================
# Release Workflow
# ============================================================================
# Triggers on a pushed version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds the release binary natively on Linux, Windows, and macOS (arm64),
# then attaches every binary to a GitHub Release with auto-generated notes.
# No version auto-bump, no registry publish.
# ============================================================================

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: webrain
            out: webrain-linux
          - os: windows-latest
            bin: webrain.exe
            out: webrain-windows.exe
          - os: macos-latest
            bin: webrain
            out: webrain-macos
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin webrain

      # linux and macos both emit target/release/webrain — rename so the release
      # has one distinct asset per platform (otherwise merge-multiple overwrites).
      - name: Rename for release
        shell: bash
        run: mv target/release/${{ matrix.bin }} target/release/${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webrain-${{ matrix.os }}
          path: target/release/${{ matrix.out }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: webrain-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
