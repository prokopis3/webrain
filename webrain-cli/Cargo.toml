[package]
name = "webrain-cli"
version.workspace = true
edition.workspace = true
# Binary crate: never publish to crates.io (path-only workspace deps wouldn't
# resolve for external consumers anyway).
publish = false

[[bin]]
name = "webrain"
path = "src/main.rs"

[features]
# ponytail: forward pdfium through webrain-mcp (its lib.rs gates the
# render arm on its own feature, which in turn enables webrain-core/pdfium).
pdfium = ["webrain-mcp/pdfium"]
# `webrain chat`: the Copilot agent loop + a bundled CLI runtime (~135 MB per
# platform, downloaded and SHA-verified at build time). Off by default so
# `cargo build` stays lean; the release matrix turns it on for every target.
chat = ["dep:github-copilot-sdk", "dep:openssl"]

[dependencies]
webrain-core = { path = "../webrain-core" }
webrain-mcp = { path = "../webrain-mcp" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }
sha2 = "0.11"
# Optional: `webrain chat`. Brings its own JSON-RPC client, permission
# handlers and the bundled runtime; nothing else in the crate depends on it.
github-copilot-sdk = { version = "1", optional = true }

# `chat` reaches `native-tls` through the SDK's `network-forwarding`, which is
# `openssl-sys` on Linux. A static musl target has no system OpenSSL to link, so
# it builds one: `vendored` compiles OpenSSL 3 with musl-gcc and links it static.
# The `dep:openssl` in `chat` is inert on every other target — this table is the
# only place the crate is declared, so nothing else ever builds it.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl = { version = "0.10", optional = true, features = ["vendored"] }
