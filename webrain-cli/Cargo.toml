[package]
name = "webrain-cli"
version.workspace = true
edition.workspace = true
# Binary crate: never publish to crates.io (path-only workspace deps wouldn't
# resolve for external consumers anyway).
publish = false

[[bin]]
name = "webrain"
path = "src/main.rs"

[features]
# ponytail: forward pdfium through webrain-mcp (its lib.rs gates the
# render arm on its own feature, which in turn enables webrain-core/pdfium).
pdfium = ["webrain-mcp/pdfium"]

[dependencies]
webrain-core = { path = "../webrain-core" }
webrain-mcp = { path = "../webrain-mcp" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }
sha2 = "0.11"
