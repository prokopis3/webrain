<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webrain chat</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #12161b;
        --line: #1f262e;
        --text: #d6dee6;
        --dim: #7c8794;
        --accent: #49d6a3;
        --warn: #e0b050;
        --bad: #e05d5d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
      }
      header b { color: var(--text); font-weight: 600; }
      main { padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
      .msg { border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.85rem; white-space: pre-wrap; word-break: break-word; }
      .msg.user { border-color: #26313c; background: #0e1318; }
      .msg.assistant { background: var(--panel); }
      .msg.err { border-color: var(--bad); color: #ffb3b3; }
      .who { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.35rem; }
      .tool { border-left: 2px solid var(--warn); padding: 0.25rem 0.6rem; color: var(--dim); font-size: 13px; }
      .tool.done { border-left-color: var(--accent); }
      .tool.fail { border-left-color: var(--bad); color: #ffb3b3; }
      .usage { border-top: 1px dashed var(--line); padding-top: 0.4rem; color: var(--dim); font-size: 12px; }
      footer { border-top: 1px solid var(--line); padding: 0.7rem 1rem; display: flex; gap: 0.6rem; }
      textarea {
        flex: 1; resize: none; min-height: 2.6rem; max-height: 8rem;
        background: var(--panel); color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 0.6rem 0.75rem; font: inherit;
      }
      textarea:focus { outline: 1px solid var(--accent); }
      button {
        background: var(--accent); color: #06110c; border: 0; border-radius: 8px;
        padding: 0 1rem; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      #modal {
        position: fixed; inset: 0; background: #000a; display: none;
        place-items: center; padding: 1rem;
      }
      #modal.on { display: grid; }
      .card {
        background: var(--panel); border: 1px solid var(--warn); border-radius: 10px;
        padding: 1rem; max-width: 44rem; width: 100%;
      }
      .card h2 { margin: 0 0 0.5rem; font-size: 14px; color: var(--warn); }
      .card pre { white-space: pre-wrap; word-break: break-word; color: var(--dim); font-size: 12px; max-height: 40vh; overflow: auto; }
      .row { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 0.8rem; }
      .deny { background: #2a313a; color: var(--text); }
      #meter { color: var(--dim); font-size: 12px; }
      /* ── harness chrome ─────────────────────────────────────────────────
         The page is a terminal-native harness, not a chatbot skin: a stats
         rail that answers "what is this costing me" without scrolling, a
         single column of evidence, and one composer at the bottom. */
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.5rem 1.5rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #0e1217, var(--bg));
      }
      .brand { display: flex; align-items: center; gap: 0.55rem; }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 0 3px #49d6a322;
      }
      .dot.busy { background: var(--warn); box-shadow: 0 0 0 3px #e0b05022; }
      .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px #e05d5d22; }
      .brand b { letter-spacing: -0.01em; }
      .brand span { color: var(--dim); font-size: 12px; }
      .stats { display: flex; gap: 1.25rem; align-items: center; }
      .stat { display: flex; flex-direction: column; gap: 1px; min-width: 4.5rem; }
      .stat u { text-decoration: none; color: #5c6773; font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; }
      .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
      main { padding: 1.25rem clamp(1rem, 6vw, 4rem); gap: 0.9rem; }
      .msg { line-height: 1.6; }
      .msg.assistant .who { color: var(--accent); }
      .tool { display: flex; gap: 0.5rem; align-items: baseline; }
      footer {
        padding: 0.85rem clamp(1rem, 6vw, 4rem);
        background: linear-gradient(0deg, #0e1217, transparent);
        align-items: flex-end;
      }
      .hint { color: #4b555f; font-size: 11px; padding: 0 0.25rem 0.35rem; }
      @media (prefers-reduced-motion: no-preference) {
        .dot.busy { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <i class="dot" id="dot"></i>
        <div>
          <b>webrain chat</b><br />
          <span id="meter">ready</span>
        </div>
      </div>
      <div class="stats">
        <span class="stat"><u>model</u><b id="stat-model">—</b></span>
        <span class="stat"><u>tokens in / out</u><b id="stat-tok">— / —</b></span>
        <span class="stat"><u>tok / s</u><b id="stat-speed">—</b></span>
        <span class="stat"><u>cost</u><b id="stat-cost">—</b></span>
      </div>
    </header>
    <main id="log"></main>
    <footer>
      <textarea id="prompt" placeholder="Ask, scrape, extract — Enter sends, Shift+Enter adds a line"></textarea>
      <button id="send">Send</button>
    </footer>
    <div id="modal">
      <div class="card">
        <h2>Permission requested</h2>
        <pre id="ask"></pre>
        <div class="row">
          <button class="deny" id="deny">Deny</button>
          <button id="allow">Approve once</button>
        </div>
      </div>
    </div>
    <script>
      // No framework on purpose: the binary serves this file, and a build step
      // would put Node back in the release path. Everything below is the
      // runtime's own event vocabulary mapped to one element per event.
      const log = document.getElementById("log");
      const meter = document.getElementById("meter");
      const dot = document.getElementById("dot");
      const stat = {
        model: document.getElementById("stat-model"),
        tok: document.getElementById("stat-tok"),
        speed: document.getElementById("stat-speed"),
        cost: document.getElementById("stat-cost"),
      };
      const promptBox = document.getElementById("prompt");
      const send = document.getElementById("send");
      const modal = document.getElementById("modal");
      let bubble = null; // the assistant bubble the next delta appends to
      let cards = new Map(); // toolCallId -> element
      let pending = null; // { id }

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        // textContent, never innerHTML: model output is untrusted input.
        if (text !== undefined) n.textContent = text;
        return n;
      };
      const scroll = () => (log.scrollTop = log.scrollHeight);

      function message(role, text) {
        const box = el("div", `msg ${role}`);
        box.append(el("div", "who", role === "user" ? "you" : "webrain"));
        const body = el("div", "", text);
        box.append(body);
        log.append(box);
        scroll();
        return body;
      }

      function onFrame(f) {
        const d = f.data || {};
        switch (f.type) {
          case "user.prompt":
            return;
          case "assistant.message_delta":
            if (!bubble) bubble = message("assistant", "");
            bubble.textContent += d.deltaContent || "";
            return scroll();
          case "assistant.message":
            // The streamed bubble is the same message: replace its text with the
            // final one (self-healing if a delta was dropped) instead of opening
            // a second bubble.
            if (bubble) {
              bubble.textContent = d.content || bubble.textContent;
              bubble = null;
            } else {
              message("assistant", d.content || "");
            }
            return;
          case "webrain.model":
            // The CLI's `· model · N in / M out`, once per model call.
            stat.model.textContent = d.model;
            stat.tok.textContent = `${d.input} / ${d.output}`;
            log.append(el("div", "usage", `· ${d.model} · ${d.input} in / ${d.output} out`));
            return scroll();
          case "webrain.usage":
            stat.model.textContent = d.model;
            stat.tok.textContent = `${d.input} / ${d.output}`;
            stat.speed.textContent = d.tokens_per_sec ? d.tokens_per_sec.toFixed(1) : "—";
            stat.cost.textContent = d.nano_aiu > 0 ? `${(d.nano_aiu / 1e9).toFixed(6)} AIU` : "n/a";
            return usageBlock(d);
          case "tool.execution_start": {
            const card = el("div", "tool", `▸ ${d.toolName || "tool"} ${d.arguments ? JSON.stringify(d.arguments) : ""}`);
            cards.set(d.toolCallId || d.toolName, card);
            log.append(card);
            return scroll();
          }
          case "tool.execution_complete":
          case "tool.execution_end": {
            const card = cards.get(d.toolCallId || d.toolName);
            const failed = d.success === false || d.error;
            if (card) {
              card.className = `tool ${failed ? "fail" : "done"}`;
              card.textContent = `${failed ? "✗" : "✓"} ${d.toolName || ""} ${failed ? (d.error || "failed") : ""}`.trim();
            }
            return scroll();
          }
          case "session.usage_info": {
            const cur = d.currentTokens ?? d.current_tokens;
            const max = d.tokenLimit ?? d.token_limit;
            if (cur) meter.textContent = `${cur}${max ? " / " + max : ""} tokens`;
            return;
          }
          case "session.usage_checkpoint":
            if (d.totalNanoAiu) meter.textContent += ` · ${d.totalNanoAiu} AIU`;
            return;
          case "model.call_failure":
            return message("err", d.message || "model call failed");
          case "session.error":
            return message("err", d.message || "turn failed");
          case "session.compaction_start":
            return log.append(el("div", "tool", "… compacting context"));
          case "session.compaction_complete":
            return log.append(el("div", "tool done", "… context compacted"));
          case "webrain.permission":
            return ask(d);
          case "webrain.error":
            return message("err", d.message || "error");
          case "assistant.idle":
          case "session.idle":
            bubble = null;
            meter.textContent = "idle";
            return setBusy(false);
          default:
            return;
        }
      }

      function usageBlock(u) {
        const cost = u.nano_aiu > 0 ? `${(u.nano_aiu / 1e9).toFixed(6)} AIU` : "n/a (your key pays)";
        const secs = u.api_ms ? (u.api_ms / 1000).toFixed(1) : "0.0";
        const speed = u.tokens_per_sec ? u.tokens_per_sec.toFixed(1) : "0.0";
        log.append(
          el(
            "div",
            "usage",
            `${u.model} · ${u.input} in / ${u.output} out · ${u.requests} request(s) · ` +
              `${secs}s API · ${speed} tok/s · ${cost}`,
          ),
        );
        scroll();
      }

      function ask(d) {
        pending = d;
        document.getElementById("ask").textContent =
          `${d.kind || "request"}\n\n${d.request || ""}`;
        modal.classList.add("on");
      }

      function answer(allow) {
        if (pending) fetch("/permission", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: pending.id, allow }),
        });
        pending = null;
        modal.classList.remove("on");
      }
      document.getElementById("allow").onclick = () => answer(true);
      document.getElementById("deny").onclick = () => answer(false);

      function setBusy(busy) {
        send.disabled = busy;
        meter.textContent = busy ? "running…" : "ready";
        dot.className = busy ? "dot busy" : "dot";
      }

      async function sendTurn() {
        const prompt = promptBox.value.trim();
        if (!prompt) return;
        promptBox.value = "";
        message("user", prompt);
        setBusy(true);
        const r = await fetch("/turn", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        if (!r.ok) {
          setBusy(false);
          message("err", r.status === 409 ? "a turn is already running" : `turn rejected (${r.status})`);
        }
      }

      send.onclick = sendTurn;
      promptBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendTurn();
        }
      });

      const stream = new EventSource("/events");
      stream.onmessage = (e) => {
        try {
          onFrame(JSON.parse(e.data));
        } catch (err) {
          console.error("bad frame", err);
        }
      };
      stream.onerror = () => (meter.textContent = "stream lost — retrying");
    </script>
  </body>
</html>
